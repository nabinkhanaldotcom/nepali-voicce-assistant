<div class="voice-console">

    <h2>Nepali Voice Assistant (Local Demo)</h2>
  
    <!-- Recording -->
    <section class="section">
      <h3>1. Record</h3>
  
      <button
        (click)="startRecording()"
        [disabled]="isRecording">
        🎙️ Start Recording
      </button>
  
      <button
        (click)="stopRecording()"
        [disabled]="!isRecording">
        ⏹️ Stop Recording
      </button>
  
      <span class="status" *ngIf="isRecording">Recording...</span>
  
      <div class="audio-preview" *ngIf="recordedAudioUrl">
        <p>Original recording:</p>
        <audio [src]="recordedAudioUrl" controls></audio>
      </div>
    </section>
  
    <!-- STT -->
    <section class="section">
      <h3>2. Speech → Text (STT)</h3>
  
      <button
        (click)="sendToStt()"
        [disabled]="isSttLoading || !lastRecordedBlob">
        🔁 Send Recording to STT
      </button>
  
      <span class="status" *ngIf="isSttLoading">Transcribing...</span>
  
      <div class="text-output">
        <label for="recognizedText">Recognized / Editable Text:</label>
        <textarea
          id="recognizedText"
          rows="5"
          [(ngModel)]="recognizedText">
        </textarea>
      </div>
    </section>
  
    <!-- TTS -->
    <section class="section">
      <h3>3. Text → Speech (TTS)</h3>
  
      <button
        (click)="speakRecognizedText()"
        [disabled]="isTtsLoading || !recognizedText.trim()">
        🔊 Speak Text
      </button>
  
      <span class="status" *ngIf="isTtsLoading">Generating speech...</span>
  
      <div class="audio-preview" *ngIf="replyAudioUrl">
        <p>AI reply audio:</p>
        <audio [src]="replyAudioUrl" controls></audio>
      </div>
    </section>
  
    <!-- Errors -->
    <div class="error" *ngIf="errorMessage">
      ⚠️ {{ errorMessage }}
    </div>
  
  </div>
